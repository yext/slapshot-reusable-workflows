name: Percy Snapshots

on:
  workflow_call:
    inputs:
      build_script:
        required: false
        type: string
        default: npm run build
      snapshots_script_path:
        required: false
        type: string
      percy_script:
        required: false
        type: string
      PERCY_PARALLEL_TOTAL:
        required: false
        type: number
      PERCY_PARALLEL_NONCE:
        required: false
        type: string
      fetch_depth:
        required: false
        type: number
        default: 1
    secrets:
      MAPBOX_API_KEY:
        required: false
      PERCY_TOKEN:
        required: true

jobs:
  percy_snapshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.fetch_depth }}
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - run: npm ci
      - run: bash -c "$BUILD_SCRIPT"
        env:
          MAPBOX_API_KEY: ${{ secrets.MAPBOX_API_KEY }}
          BUILD_SCRIPT: ${{ inputs.build_script }}
      - name: Percy Snapshots
        run: |
          merged_percy_script='npx percy exec -- node "$SNAPSHOTS_SCRIPT_PATH"'
          if [[ -n "${PERCY_SCRIPT:-}" ]]
          then
            merged_percy_script="${PERCY_SCRIPT}"
          fi
          bash -c "$merged_percy_script"
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          PERCY_PARALLEL_NONCE: ${{ inputs.PERCY_PARALLEL_NONCE }}
          PERCY_PARALLEL_TOTAL: ${{ inputs.PERCY_PARALLEL_TOTAL }}
          SNAPSHOTS_SCRIPT_PATH: ${{ inputs.snapshots_script_path }}
          PERCY_SCRIPT: ${{ inputs.percy_script }}
